[workspace]
# v0.6 — workspace: le cheat (racine) + le launcher (crate séparée).
#   cargo build --release            → tout (vantyx.exe + launcher)
#   cargo build --release -p vantyx-launcher → le launcher seul
members = ["launcher"]
resolver = "2"

[package]
name = "vantyx"
version = "0.9.6"
edition = "2021"

# windows-rs PINÉ en 0.58.0 — toutes les signatures du code ont été vérifiées
# contre le code source du tag 0.58.0 (github.com/microsoft/windows-rs).
# En cas de bump de version: héritage COM, gates de features et naming des
# champs (camelCase) sont les points qui cassent — voir l'en-tête overlay.rs.
[dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Security", # ← SECURITY_ATTRIBUTES requis par CreateWaitableTimerExW (timer HR v0.8)
    "Foundation_Numerics", # ← débloque ID2D1RenderTarget::CreateSolidColorBrush (feature-gated)
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls", # ← BST_CHECKED/BST_UNCHECKED (cases à cocher du panneau GUI)
    "Win32_Graphics_DirectWrite", # ← DWriteCreateFactory/IDWriteTextFormat — texte du menu glass (alpha prémultiplié)
    "Win32_Media", # ← timeBeginPeriod(1) — granularité timer système 15.6ms → 1ms (v0.8)
] }

[profile.release]
# v0.8 — lto FAT + codegen-units 1: binaire plus dense, inlining complet à
# travers les crates (windows-rs compris), zéro symbole résiduel. panic reste
# "unwind" (overlay.rs protège le rendu par catch_unwind — abort casserait
# ce filet de sécurité).
lto = "fat"
codegen-units = 1
