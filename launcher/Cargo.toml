[package]
name = "vantyx-launcher"
version = "2.0.0"
edition = "2021"

[dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Security", # v0.6.1 — requis par CreateProcessW (SECURITY_ATTRIBUTES dans la signature 0.58)
    "Foundation_Numerics",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }

# note: [profile.release] vit à la RACINE du workspace (Cargo.toml) — un
# profil dans un member est ignoré par cargo (warning "profiles for the non
# root package will be ignored").
